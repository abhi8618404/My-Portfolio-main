<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blogGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#blogGrad)" opacity="0.1"/>
  
  <!-- Blog Post Card 1 -->
  <rect x="40" y="40" width="140" height="100" rx="8" fill="white" opacity="0.95"/>
  <rect x="50" y="50" width="60" height="8" rx="4" fill="url(#blogGrad2)" opacity="0.7"/>
  <rect x="50" y="65" width="120" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="75" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="85" width="110" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="100" width="80" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="50" y="110" width="50" height="20" rx="4" fill="url(#blogGrad2)" opacity="0.8"/>
  
  <!-- Blog Post Card 2 -->
  <rect x="220" y="40" width="140" height="100" rx="8" fill="white" opacity="0.95"/>
  <rect x="230" y="50" width="70" height="8" rx="4" fill="url(#blogGrad2)" opacity="0.7"/>
  <rect x="230" y="65" width="120" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="75" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="85" width="110" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="100" width="90" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="230" y="110" width="60" height="20" rx="4" fill="url(#blogGrad2)" opacity="0.8"/>
  
  <!-- Blog Post Card 3 -->
  <rect x="40" y="160" width="140" height="100" rx="8" fill="white" opacity="0.95"/>
  <rect x="50" y="170" width="55" height="8" rx="4" fill="url(#blogGrad2)" opacity="0.7"/>
  <rect x="50" y="185" width="120" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="195" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="205" width="110" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="220" width="75" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="50" y="230" width="45" height="20" rx="4" fill="url(#blogGrad2)" opacity="0.8"/>
  
  <!-- Blog Post Card 4 -->
  <rect x="220" y="160" width="140" height="100" rx="8" fill="white" opacity="0.95"/>
  <rect x="230" y="170" width="65" height="8" rx="4" fill="url(#blogGrad2)" opacity="0.7"/>
  <rect x="230" y="185" width="120" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="195" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="205" width="110" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="230" y="220" width="85" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="230" y="230" width="55" height="20" rx="4" fill="url(#blogGrad2)" opacity="0.8"/>
  
