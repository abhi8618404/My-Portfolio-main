<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="attGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="attGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#attGrad)" opacity="0.1"/>
  
  <!-- Camera/Recognition Frame -->
  <rect x="100" y="40" width="200" height="160" rx="12" fill="white" opacity="0.95" stroke="url(#attGrad)" stroke-width="3"/>
  <rect x="120" y="60" width="160" height="120" rx="8" fill="#F3F4F6"/>
  
  <!-- Face Recognition Circle -->
  <circle cx="200" cy="120" r="35" fill="none" stroke="url(#attGrad2)" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="200" cy="120" r="25" fill="url(#attGrad)" opacity="0.3"/>
  
  <!-- Face Features -->
  <ellipse cx="190" cy="110" rx="4" ry="5" fill="#1F2937"/>
  <ellipse cx="210" cy="110" rx="4" ry="5" fill="#1F2937"/>
  <path d="M 190 125 Q 200 130 210 125" stroke="#1F2937" stroke-width="2" fill="none"/>
  
  <!-- Status Indicator -->
  <circle cx="200" cy="230" r="8" fill="#10B981"/>
  <rect x="180" y="245" width="40" height="8" rx="4" fill="#10B981" opacity="0.8"/>
  
  <!-- Recognition Data -->
  <rect x="50" y="220" width="100" height="60" rx="8" fill="white" opacity="0.95"/>
  <rect x="60" y="230" width="80" height="6" rx="3" fill="#6B7280"/>
  <rect x="60" y="245" width="60" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="60" y="255" width="70" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="60" y="265" width="50" height="5" rx="2" fill="#9CA3AF"/>
  
  <rect x="250" y="220" width="100" height="60" rx="8" fill="white" opacity="0.95"/>
  <rect x="260" y="230" width="80" height="6" rx="3" fill="#6B7280"/>
  <rect x="260" y="245" width="60" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="260" y="255" width="70" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="260" y="265" width="50" height="5" rx="2" fill="#9CA3AF"/>
</svg>
